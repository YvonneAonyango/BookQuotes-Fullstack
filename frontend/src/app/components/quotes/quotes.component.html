<div class="quotes-page">

  <!-- PAGE HEADER -->
  <header class="page-header">
    <h1>{{ 'myQuotes' | translate }}</h1>
    <p class="page-subtitle">
      Browse some of my favourite quotes
    </p>
  </header>

  <!-- QUOTES LIST -->
  <section class="section quotes-list">
    <ul class="quotes-list-ul">
      <li class="quote-item" *ngFor="let quote of globalQuotes">
        <p class="quote-text">“{{ quote.text }}”</p>
        <p class="quote-footer">— {{ quote.author }}</p>

        <!-- EDIT / DELETE BUTTONS (only visible to Yvonne) -->
        <div class="quote-buttons" *ngIf="isOwner()">
          <button type="button" (click)="editQuote(quote)">Edit</button>
          <button type="button" (click)="deleteQuote(quote.id)">Delete</button>
        </div>
      </li>
    </ul>
  </section>

  <!-- USER-ADDED QUOTES FORM (ONLY VISIBLE TO OWNER) -->
  <section class="section form-section" *ngIf="isOwner()">
    <header class="section-header">
      <h3>{{ isEdit ? ('editQuote' | translate) : ('addQuote' | translate) }}</h3>
      <p>{{ 'manageQuotesDesc' | translate }}</p>
    </header>

    <form [formGroup]="quoteForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="text">{{ 'quoteText' | translate }}</label>
        <textarea
          id="text"
          formControlName="text"
          rows="3"
          placeholder="{{ 'enterQuoteText' | translate }}">
        </textarea>
      </div>

      <div class="form-group">
        <label for="author">{{ 'author' | translate }}</label>
        <input
          id="author"
          type="text"
          formControlName="author"
          placeholder="Yvonne">
      </div>

      <div class="form-group">
        <label for="bookId">{{ 'selectBook' | translate }}</label>
        <select id="bookId" formControlName="bookId">
          <option [ngValue]="null">{{ 'noBook' | translate }}</option>
          <option *ngFor="let book of books" [ngValue]="book.id">
            {{ book.title }}
          </option>
        </select>
      </div>

      <div class="form-buttons">
        <button type="submit" class="btn-add-quote" [disabled]="isLoading">
          {{ isEdit ? ('updateQuote' | translate) : ('addQuote' | translate) }}
        </button>

        <button type="button" class="btn-cancel" (click)="resetForm()">
          {{ 'cancel' | translate }}
        </button>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

    </form>
  </section>

</div>

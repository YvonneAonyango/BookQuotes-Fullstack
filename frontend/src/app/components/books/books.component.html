<div class="books-page">

  <!-- Header -->
  <div class="page-header">
    <h1>{{ 'myBooks' | translate }}</h1>
    <p class="lead">{{ 'manageBookCollection' | translate }}</p>

    <!-- Add button ONLY if logged in -->
    <button
      *ngIf="isLoggedIn()"
      class="btn btn-primary"
      (click)="addBook()">
      {{ 'addNewBook' | translate }}
    </button>

    <!-- Guest hint -->
    <p *ngIf="!isLoggedIn()" class="text-muted">
      Browse books freely 📚
      <a routerLink="/login">Login</a> to add or manage books.
    </p>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="loading-state">
    <p>{{ 'loadingBooks' | translate }}</p>
  </div>

  <!-- Books Grid -->
  <div class="books-grid">
    <div *ngFor="let book of books" class="book-card">

      <h5>{{ book.title }}</h5>
      <p *ngIf="book.author">{{ book.author }}</p>

      <small *ngIf="book.publishDate">
        {{ formatDate(book.publishDate) }}
      </small>

      <!-- Actions ONLY if logged in -->
      <div class="book-card-footer" *ngIf="isLoggedIn()">
        <button (click)="editBook(book.id!)">
          {{ 'editItem' | translate }}
        </button>
        <button (click)="deleteBook(book.id!)">
          {{ 'deleteItem' | translate }}
        </button>
      </div>

    </div>
  </div>

  <!-- Book Form -->
  <app-book-form
    *ngIf="showFormModal"
    [book]="editingBook"
    [isEdit]="isEditMode"
    (close)="closeForm($event)">
  </app-book-form>

</div>

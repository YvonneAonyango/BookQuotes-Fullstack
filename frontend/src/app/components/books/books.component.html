<div class="books-page">

  <header class="page-header">
    <h1>{{ 'myBooks' | translate }}</h1>
    <p class="lead">{{ 'manageBookCollection' | translate }}</p>

    <button
      *ngIf="isLoggedIn()"
      class="btn-add-book"
      (click)="addBook()">
      {{ 'addNewBook' | translate }}
    </button>
  </header>

  <section class="section books-list">
    <div *ngIf="isLoading" class="loading">
      {{ 'loadingBooks' | translate }}
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div *ngIf="books.length > 0" class="books-container">
      <div *ngFor="let book of books" class="book-card">

        <!-- STAR FAVORITE ICON -->
        <div class="book-fav-icon" (click)="toggleFavorite(book)">
          <fa-icon [icon]="faStar" [ngClass]="{'favorite': book.isFavorite}"></fa-icon>
        </div>

        <!-- BOOK COVER -->
        <div class="book-card-header">
          <img
            *ngIf="book.coverUrl; else noCover"
            [src]="book.coverUrl"
            alt="{{ book.title }}"
          />
          <ng-template #noCover>📚</ng-template>
        </div>

        <div class="book-card-body">
          <div class="book-title">{{ book.title }}</div>
          <div class="book-author">{{ book.author }}</div>
          <div class="book-meta">
            {{ formatDate(book.publishDate) }}
          </div>
        </div>

        <div class="book-card-footer" *ngIf="isLoggedIn()">
          <button class="btn-edit" (click)="editBook(book)">
            <i class="fa fa-edit"></i> {{ 'edit' | translate }}
          </button>
          <button class="btn-delete" (click)="deleteBook(book)">
            <i class="fa fa-trash"></i> {{ 'delete' | translate }}
          </button>
        </div>

      </div>
    </div>

    <p *ngIf="books.length === 0" class="no-books">
      {{ 'noBooksYet' | translate }}
    </p>
  </section>

</div>

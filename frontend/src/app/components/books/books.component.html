<div class="books-page">

  <!-- Header -->
  <div class="page-header">
    <h1>{{ 'myBooks' | translate }}</h1>
    <p class="lead">{{ 'manageBookCollection' | translate }}</p>

    <!-- Add Book Button -->
    <button
      *ngIf="isLoggedIn()"
      class="btn-add-book"
      (click)="addBook()">
      {{ 'addNewBook' | translate }}
    </button>

    <!-- Guest Hint -->
    <p *ngIf="!isLoggedIn()" class="text-muted">
      Browse books freely 📚
      <a routerLink="/login">Login</a> to add or manage books.
    </p>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="loading-state">
    <p>{{ 'loadingBooks' | translate }}</p>
  </div>

  <!-- Books Grid -->
  <div class="books-container">
    <div *ngFor="let book of books" class="book-card">

      <!-- Favorite Star -->
      <span class="book-fav-icon">★</span>

      <div class="book-card-header">
        <i class="fa fa-book book-icon"></i>
      </div>

      <div class="book-card-body">
        <h5 class="book-title">{{ book.title }}</h5>
        <p class="book-author" *ngIf="book.author">
          <i class="fa fa-user"></i> {{ book.author }}
        </p>

        <div class="book-meta">
          <small *ngIf="book.publishDate">{{ formatDate(book.publishDate) }}</small>
        </div>
      </div>

      <div class="book-card-footer" *ngIf="book.isOwner">
        <button class="btn-edit" (click)="editBook(book.id!)">
          <i class="fa fa-edit"></i> {{ 'editItem' | translate }}
        </button>

        <button class="btn-delete" (click)="deleteBook(book.id!)">
          <i class="fa fa-trash"></i> {{ 'deleteItem' | translate }}
        </button>
      </div>
    </div>
  </div>

  <!-- Book Form Modal -->
  <app-book-form
    *ngIf="showFormModal"
    [book]="editingBook"
    [isEdit]="isEditMode"
    (close)="closeForm($event)">
  </app-book-form>

</div>
